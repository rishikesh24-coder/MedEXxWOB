<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="capFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="capTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="capBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="capShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#f8fafc" rx="16"/>

  <!-- Blister Card -->
  <g filter="url(#capShadow)">
    <rect x="50" y="40" width="300" height="220" rx="16" fill="url(#capFoil)" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Capsule cavities (6 capsules) -->
  <!-- Row 1 -->
  <!-- Cap 1 -->
  <g transform="translate(85, 65)">
    <rect x="0" y="0" width="45" height="38" rx="16" fill="url(#capTop)"/>
    <rect x="0" y="36" width="45" height="38" rx="16" fill="url(#capBottom)" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="37" x2="45" y2="37" stroke="#991b1b" stroke-width="1.5"/>
  </g>
  <!-- Cap 2 -->
  <g transform="translate(175, 65)">
    <rect x="0" y="0" width="45" height="38" rx="16" fill="url(#capTop)"/>
    <rect x="0" y="36" width="45" height="38" rx="16" fill="url(#capBottom)" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="37" x2="45" y2="37" stroke="#991b1b" stroke-width="1.5"/>
  </g>
  <!-- Cap 3 -->
  <g transform="translate(265, 65)">
    <rect x="0" y="0" width="45" height="38" rx="16" fill="url(#capTop)"/>
    <rect x="0" y="36" width="45" height="38" rx="16" fill="url(#capBottom)" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="37" x2="45" y2="37" stroke="#991b1b" stroke-width="1.5"/>
  </g>

  <!-- Row 2 -->
  <!-- Cap 4 -->
  <g transform="translate(85, 155)">
    <rect x="0" y="0" width="45" height="38" rx="16" fill="url(#capTop)"/>
    <rect x="0" y="36" width="45" height="38" rx="16" fill="url(#capBottom)" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="37" x2="45" y2="37" stroke="#991b1b" stroke-width="1.5"/>
  </g>
  <!-- Cap 5 -->
  <g transform="translate(175, 155)">
    <rect x="0" y="0" width="45" height="38" rx="16" fill="url(#capTop)"/>
    <rect x="0" y="36" width="45" height="38" rx="16" fill="url(#capBottom)" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="37" x2="45" y2="37" stroke="#991b1b" stroke-width="1.5"/>
  </g>
  <!-- Cap 6 -->
  <g transform="translate(265, 155)">
    <rect x="0" y="0" width="45" height="38" rx="16" fill="url(#capTop)"/>
    <rect x="0" y="36" width="45" height="38" rx="16" fill="url(#capBottom)" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="37" x2="45" y2="37" stroke="#991b1b" stroke-width="1.5"/>
  </g>

  <!-- Spec Badge -->
  <rect x="290" y="20" width="85" height="24" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="332" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">CAPSULE</text>
</svg>
