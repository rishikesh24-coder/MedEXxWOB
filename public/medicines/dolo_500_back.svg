<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="foilBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#f8fafc"/>

  <!-- Blister Strip Card (Reverse) -->
  <g filter="url(#shadow)">
    <rect x="40" y="35" width="320" height="230" rx="16" fill="url(#foilBack)" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Repeatable Pharma Foil Text Pattern -->
  <g fill="#1e293b" opacity="0.85" font-family="monospace">
    <!-- Row 1 -->
    <text x="55" y="70" font-size="11" font-weight="900" fill="#0284c7">DOLO 500</text>
    <text x="140" y="70" font-size="9" font-weight="700">Paracetamol IP 500mg</text>
    <text x="280" y="70" font-size="8" font-weight="700">B.No. PCM2401</text>

    <text x="55" y="90" font-size="7.5" font-weight="600" fill="#475569">Mfg. Lic. No.: M/642/2014</text>
    <text x="210" y="90" font-size="7.5" font-weight="600" fill="#475569">Mfg: 04/2024 • Exp: 04/2027</text>

    <line x1="45" y1="105" x2="355" y2="105" stroke="#64748b" stroke-dasharray="4 4" stroke-width="0.8"/>

    <!-- Row 2 -->
    <text x="55" y="130" font-size="11" font-weight="900" fill="#0284c7">DOLO 500</text>
    <text x="140" y="130" font-size="9" font-weight="700">Paracetamol IP 500mg</text>
    <text x="280" y="130" font-size="8" font-weight="700">M.R.P. ₹ 1.50</text>

    <text x="55" y="150" font-size="7.5" font-weight="600" fill="#475569">Dosage: As directed by physician</text>
    <text x="210" y="150" font-size="7.5" font-weight="600" fill="#475569">Store below 25°C in dry place</text>

    <line x1="45" y1="165" x2="355" y2="165" stroke="#64748b" stroke-dasharray="4 4" stroke-width="0.8"/>

    <!-- Row 3 -->
    <text x="55" y="190" font-size="11" font-weight="900" fill="#0284c7">DOLO 500</text>
    <text x="140" y="190" font-size="9" font-weight="700">Paracetamol IP 500mg</text>
    <text x="280" y="190" font-size="8" font-weight="700">B.No. PCM2401</text>

    <text x="55" y="210" font-size="8" font-weight="700" fill="#334155">Mfd. by: MICRO LABS LIMITED</text>
    <text x="240" y="210" font-size="7.5" font-weight="600" fill="#475569">Pune Plant, MH</text>

    <line x1="45" y1="225" x2="355" y2="225" stroke="#64748b" stroke-dasharray="4 4" stroke-width="0.8"/>

    <!-- Bottom Stamp -->
    <text x="55" y="248" font-size="8" font-weight="800" fill="#0369a1">VERIFIED CDSCO HOSPITAL STOCK</text>
    <text x="345" y="248" font-size="8" font-weight="700" fill="#64748b" text-anchor="end">15 TABLETS STRIP</text>
  </g>
</svg>
