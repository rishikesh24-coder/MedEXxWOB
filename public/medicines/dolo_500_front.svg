<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="300" fill="#f8fafc"/>

  <!-- Blister Strip Card -->
  <g filter="url(#shadow)">
    <rect x="40" y="35" width="320" height="230" rx="16" fill="url(#foilGrad)" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Blister Texture Grid -->
  <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="none"/>
    <circle cx="3" cy="3" r="0.75" fill="#94a3b8" opacity="0.4"/>
  </pattern>
  <rect x="42" y="37" width="316" height="226" rx="14" fill="url(#grid)"/>

  <!-- Top Header Strip -->
  <rect x="40" y="35" width="320" height="42" rx="16" fill="url(#headerGrad)"/>
  <rect x="40" y="60" width="320" height="17" fill="url(#headerGrad)"/>
  
  <text x="55" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="0.5">DOLO 500</text>
  <text x="145" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#bae6fd">Paracetamol Tablets IP 500 mg</text>
  <text x="345" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="end">15 TABS</text>

  <!-- Tablets Grid (3 rows of 5 tablets) -->
  <!-- Row 1 -->
  <g fill="url(#pillGrad)" stroke="#cbd5e1" stroke-width="1">
    <rect x="62" y="90" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="84" y1="94" x2="84" y2="120" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    
    <rect x="120" y="90" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="142" y1="94" x2="142" y2="120" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="178" y="90" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="200" y1="94" x2="200" y2="120" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="236" y="90" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="258" y1="94" x2="258" y2="120" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="294" y="90" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="316" y1="94" x2="316" y2="120" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Row 2 -->
  <g fill="url(#pillGrad)" stroke="#cbd5e1" stroke-width="1">
    <rect x="62" y="136" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="84" y1="140" x2="84" y2="166" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="120" y="136" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="142" y1="140" x2="142" y2="166" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="178" y="136" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="200" y1="140" x2="200" y2="166" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="236" y="136" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="258" y1="140" x2="258" y2="166" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="294" y="136" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="316" y1="140" x2="316" y2="166" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Row 3 -->
  <g fill="url(#pillGrad)" stroke="#cbd5e1" stroke-width="1">
    <rect x="62" y="182" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="84" y1="186" x2="84" y2="212" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="120" y="182" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="142" y1="186" x2="142" y2="212" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="178" y="182" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="200" y1="186" x2="200" y2="212" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="236" y="182" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="258" y1="186" x2="258" y2="212" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="294" y="182" width="44" height="34" rx="17" filter="url(#shadow)"/>
    <line x1="316" y1="186" x2="316" y2="212" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Footer Branding -->
  <rect x="40" y="235" width="320" height="30" rx="4" fill="#0f172a" opacity="0.04"/>
  <text x="55" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#475569">MICRO LABS LIMITED</text>
  <text x="345" y="250" font-family="monospace" font-size="8" font-weight="600" fill="#64748b" text-anchor="end">BATCH: PCM2401 • EXP: 04/2027</text>
</svg>
