<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="plungerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="syringeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#f8fafc" rx="16"/>

  <!-- Syringe Diagonal Layout -->
  <g filter="url(#syringeShadow)" transform="rotate(-25 200 150)">
    <!-- Needle Guard -->
    <rect x="35" y="146" width="70" height="8" rx="2" fill="#94a3b8"/>
    <polygon points="35,147 15,150 35,153" fill="#cbd5e1"/>

    <!-- Syringe Barrel -->
    <rect x="100" y="132" width="160" height="36" rx="4" fill="url(#barrelGrad)" stroke="#64748b" stroke-width="1.5"/>
    
    <!-- Measurement Scale Lines -->
    <line x1="120" y1="132" x2="120" y2="146" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="140" y1="132" x2="140" y2="142" stroke="#0284c7" stroke-width="1"/>
    <line x1="160" y1="132" x2="160" y2="148" stroke="#0284c7" stroke-width="2"/>
    <line x1="180" y1="132" x2="180" y2="142" stroke="#0284c7" stroke-width="1"/>
    <line x1="200" y1="132" x2="200" y2="148" stroke="#0284c7" stroke-width="2"/>
    <line x1="220" y1="132" x2="220" y2="142" stroke="#0284c7" stroke-width="1"/>
    <line x1="240" y1="132" x2="240" y2="148" stroke="#0284c7" stroke-width="2"/>

    <!-- Rubber Stopper inside Barrel -->
    <rect x="195" y="134" width="20" height="32" rx="3" fill="#334155"/>

    <!-- Plunger Rod -->
    <rect x="215" y="145" width="110" height="10" fill="url(#plungerGrad)"/>
    <rect x="325" y="130" width="12" height="40" rx="3" fill="url(#plungerGrad)"/>

    <!-- Flange Finger Grips -->
    <rect x="255" y="120" width="10" height="60" rx="3" fill="#94a3b8"/>
  </g>

  <!-- Spec Badge -->
  <rect x="280" y="25" width="95" height="24" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="327" y="41" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">PREFILLED SYR</text>
</svg>
