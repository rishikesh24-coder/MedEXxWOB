<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="p500Foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="p500Header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#f8fafc"/>

  <!-- Blister Strip Card -->
  <g filter="url(#pShadow)">
    <rect x="50" y="40" width="300" height="220" rx="14" fill="url(#p500Foil)" stroke="#10b981" stroke-width="1.5"/>
  </g>

  <!-- Green Header Strip -->
  <rect x="50" y="40" width="300" height="40" rx="14" fill="url(#p500Header)"/>
  <rect x="50" y="65" width="300" height="15" fill="url(#p500Header)"/>
  
  <text x="65" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff">P-500</text>
  <text x="135" y="60" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#d1fae5">Paracetamol Tablets IP 500 mg</text>
  <text x="335" y="62" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="end">10 TABS</text>

  <!-- 2 rows of 5 oblong tablets -->
  <g fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2">
    <!-- Row 1 -->
    <rect x="75" y="100" width="38" height="48" rx="14" filter="url(#pShadow)"/>
    <rect x="128" y="100" width="38" height="48" rx="14" filter="url(#pShadow)"/>
    <rect x="181" y="100" width="38" height="48" rx="14" filter="url(#pShadow)"/>
    <rect x="234" y="100" width="38" height="48" rx="14" filter="url(#pShadow)"/>
    <rect x="287" y="100" width="38" height="48" rx="14" filter="url(#pShadow)"/>

    <!-- Row 2 -->
    <rect x="75" y="160" width="38" height="48" rx="14" filter="url(#pShadow)"/>
    <rect x="128" y="160" width="38" height="48" rx="14" filter="url(#pShadow)"/>
    <rect x="181" y="160" width="38" height="48" rx="14" filter="url(#pShadow)"/>
    <rect x="234" y="160" width="38" height="48" rx="14" filter="url(#pShadow)"/>
    <rect x="287" y="160" width="38" height="48" rx="14" filter="url(#pShadow)"/>
  </g>

  <!-- Score lines in tablets -->
  <g stroke="#6ee7b7" stroke-width="1.5">
    <line x1="80" y1="124" x2="108" y2="124"/>
    <line x1="133" y1="124" x2="161" y2="124"/>
    <line x1="186" y1="124" x2="214" y2="124"/>
    <line x1="239" y1="124" x2="267" y2="124"/>
    <line x1="292" y1="124" x2="320" y2="124"/>

    <line x1="80" y1="184" x2="108" y2="184"/>
    <line x1="133" y1="184" x2="161" y2="184"/>
    <line x1="186" y1="184" x2="214" y2="184"/>
    <line x1="239" y1="184" x2="267" y2="184"/>
    <line x1="292" y1="184" x2="320" y2="184"/>
  </g>

  <!-- Footer -->
  <rect x="50" y="225" width="300" height="35" rx="4" fill="#065f46" opacity="0.06"/>
  <text x="65" y="244" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#047857">APEX LABORATORIES PVT LTD</text>
  <text x="335" y="244" font-family="monospace" font-size="8" font-weight="600" fill="#065f46" text-anchor="end">BATCH: APX-551 • EXP: 01/2027</text>
</svg>
