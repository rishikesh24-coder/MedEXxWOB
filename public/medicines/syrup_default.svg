<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="35%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="syrupCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="syrupShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#f8fafc" rx="16"/>

  <!-- Bottle Group -->
  <g filter="url(#syrupShadow)">
    <!-- Amber Bottle Body -->
    <rect x="145" y="100" width="110" height="150" rx="14" fill="url(#amberGlass)" stroke="#451a03" stroke-width="1.5"/>
    
    <!-- Label -->
    <rect x="145" y="125" width="110" height="95" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="145" y="125" width="110" height="8" fill="#d97706"/>
    <rect x="155" y="145" width="65" height="7" rx="2" fill="#0f172a"/>
    <rect x="155" y="157" width="90" height="4" rx="1" fill="#64748b"/>
    <rect x="155" y="166" width="50" height="4" rx="1" fill="#94a3b8"/>
    <rect x="155" y="180" width="70" height="20" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
    <text x="160" y="194" font-family="monospace" font-size="9" font-weight="bold" fill="#b45309">ORAL SYRUP</text>

    <!-- Bottle Shoulders -->
    <path d="M 145 105 Q 170 85 180 80 L 220 80 Q 230 85 255 105 Z" fill="url(#amberGlass)" stroke="#451a03" stroke-width="1"/>
    
    <!-- Bottle Neck -->
    <rect x="180" y="55" width="40" height="30" fill="url(#amberGlass)" stroke="#451a03" stroke-width="1.5"/>
    
    <!-- Measuring Cup Cap -->
    <rect x="175" y="32" width="50" height="28" rx="4" fill="url(#syrupCap)" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="178" y1="42" x2="190" y2="42" stroke="#94a3b8" stroke-width="1"/>
    <line x1="178" y1="48" x2="195" y2="48" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Spec Badge -->
  <rect x="290" y="30" width="85" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="332" y="46" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">SYRUP</text>
</svg>
