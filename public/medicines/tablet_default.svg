<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="tabFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="tabShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#f8fafc" rx="16"/>

  <!-- Blister Card -->
  <g filter="url(#tabShadow)">
    <rect x="50" y="40" width="300" height="220" rx="16" fill="url(#tabFoil)" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- 6 Tablets in cavities -->
  <!-- Row 1 -->
  <g transform="translate(80, 70)">
    <circle cx="30" cy="30" r="28" fill="url(#pillGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="12" y1="30" x2="48" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <g transform="translate(170, 70)">
    <circle cx="30" cy="30" r="28" fill="url(#pillGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="12" y1="30" x2="48" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <g transform="translate(260, 70)">
    <circle cx="30" cy="30" r="28" fill="url(#pillGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="12" y1="30" x2="48" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Row 2 -->
  <g transform="translate(80, 150)">
    <circle cx="30" cy="30" r="28" fill="url(#pillGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="12" y1="30" x2="48" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <g transform="translate(170, 150)">
    <circle cx="30" cy="30" r="28" fill="url(#pillGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="12" y1="30" x2="48" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <g transform="translate(260, 150)">
    <circle cx="30" cy="30" r="28" fill="url(#pillGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="12" y1="30" x2="48" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Spec Badge -->
  <rect x="290" y="20" width="85" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="332" y="36" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">TABLET</text>
</svg>
