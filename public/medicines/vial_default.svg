<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="vialGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="vialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#f8fafc" rx="16"/>

  <!-- Vial Body Shadow & Outer -->
  <g filter="url(#vialShadow)">
    <!-- Vial Glass Body -->
    <rect x="145" y="90" width="110" height="155" rx="16" fill="url(#vialGlass)" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Liquid Level Inside Vial -->
    <rect x="148" y="145" width="104" height="96" rx="12" fill="url(#liquidGrad)"/>
    
    <!-- Measurement graduation tick marks -->
    <line x1="150" y1="160" x2="162" y2="160" stroke="#0369a1" stroke-width="1.5" opacity="0.6"/>
    <line x1="150" y1="180" x2="168" y2="180" stroke="#0369a1" stroke-width="2" opacity="0.7"/>
    <line x1="150" y1="200" x2="162" y2="200" stroke="#0369a1" stroke-width="1.5" opacity="0.6"/>
    <line x1="150" y1="220" x2="168" y2="220" stroke="#0369a1" stroke-width="2" opacity="0.7"/>

    <!-- Pharmaceutical Label Band -->
    <rect x="145" y="115" width="110" height="75" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="145" y="115" width="110" height="8" fill="#0284c7"/>
    <rect x="155" y="132" width="60" height="6" rx="2" fill="#0f172a"/>
    <rect x="155" y="143" width="85" height="4" rx="1" fill="#64748b"/>
    <rect x="155" y="151" width="45" height="4" rx="1" fill="#94a3b8"/>
    <rect x="155" y="162" width="70" height="18" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
    <text x="160" y="174" font-family="monospace" font-size="8" font-weight="bold" fill="#15803d">STERILE IV</text>

    <!-- Vial Neck -->
    <rect x="175" y="65" width="50" height="25" fill="url(#vialGlass)" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Aluminum Crimp Collar -->
    <rect x="168" y="52" width="64" height="15" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    
    <!-- Flip-Off Plastic Cap -->
    <rect x="163" y="38" width="74" height="16" rx="5" fill="url(#sealGrad)" stroke="#0369a1" stroke-width="1"/>
  </g>

  <!-- Spec Badge -->
  <rect x="290" y="30" width="85" height="24" rx="12" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="332" y="46" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">VIAL / INJ</text>
</svg>
